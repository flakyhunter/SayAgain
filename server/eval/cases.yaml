# Eval cases for the retelling checker. Each case: a real question id from the app, what a
# learner might write, and the verdict a fair teacher would give.
# `accept` lists every verdict that counts as correct for a borderline case.
# Tags: paraphrase, broken-english, russian, answered, two-part, shifted, wrong, opposite,
# vague, injection.

