name: SayAgain

options:
  bundleIdPrefix: dev.flakyhunter
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

packages:
  SayAgainKit:
    path: Packages/SayAgainKit
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.18.0"

targets:
  SayAgain:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: SayAgainKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Say Again
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        SAFeedbackEndpoint: $(FEEDBACK_ENDPOINT)
        NSMicrophoneUsageDescription: Say Again uses the microphone only while you dictate your answer. The audio stays on your iPhone and is not saved.
        NSSpeechRecognitionUsageDescription: Your speech is turned into text on your iPhone, so you can say what you heard instead of typing it.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.flakyhunter.sayagain
      configs:
        # Debug talks to `npm run dev` in server/ (wrangler dev on the Mac).
        Debug:
          FEEDBACK_ENDPOINT: "http://localhost:8787"
        # Set to the deployed Worker URL before the release. Empty hides AI feedback.
        Release:
          FEEDBACK_ENDPOINT: ""

  SayAgainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
        excludes: ["__Snapshots__/**"]
    dependencies:
      - target: SayAgain
      - package: SayAgainKit
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.flakyhunter.sayagain.tests
        GENERATE_INFOPLIST_FILE: YES

  SayAgainUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: SayAgain
      - package: SayAgainKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.flakyhunter.sayagain.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SayAgain:
    build:
      targets:
        SayAgain: all
    test:
      gatherCoverageData: true
      coverageTargets: [SayAgain]
      targets:
        - SayAgainTests
        - SayAgainUITests
