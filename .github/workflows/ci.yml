name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Unit tests (SayAgainKit)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.1"
      - name: Run package tests
        run: swift test --package-path Packages/SayAgainKit

  app-tests:
    name: Snapshot + UI tests (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.1"
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Run app tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SayAgain.xcodeproj \
            -scheme SayAgain \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.1" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 14
